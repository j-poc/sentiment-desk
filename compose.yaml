services:
  sentiment-desk:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DB_PATH: /app/data/desk.db
      EXTERNAL_REQUESTS_ENABLED: "${EXTERNAL_REQUESTS_ENABLED:-false}"
      EXTERNAL_SOURCE_COLLECTORS: "${EXTERNAL_SOURCE_COLLECTORS:-}"
      SOURCE_RIGHTS_APPROVED_COLLECTORS: "${SOURCE_RIGHTS_APPROVED_COLLECTORS:-}"
      TYPESAFE_ACCOUNT_USE_APPROVED: "${TYPESAFE_ACCOUNT_USE_APPROVED:-false}"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - desk-data:/app/data

volumes:
  desk-data:
