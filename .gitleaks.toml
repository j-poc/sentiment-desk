title = "Sentiment Desk source scan"

[extend]
useDefault = true

[allowlist]
description = "Exclude Git-ignored local task records, evidence and runtime databases; they may contain user prompts, provider material or credentials and are never publishable source."
paths = [
  '''(^|/)\.quality-loop/''',
  '''(^|/)\.engineering-evidence/''',
  '''(^|/)data/''',
]
